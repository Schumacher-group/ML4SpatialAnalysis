data:
  cell_table: ./data/updated_cell_table_Ki67.csv
  # Patient-level metadata is kept local and never tracked in this repository.
  metadata: ./data/CleanCohort_Metadata.csv
  cache_path: ./data/patient_roi_v5_revision62_noqc.pkl
  # Same exclusions as the ROI-level rerun (62-patient revision cohort).
  exclusions_file: configs/cohort_exclusions.yaml
  # No filtering on the old, expression-derived qc_pass flag (rerun decision,
  # Nov 2026); enabling it changes the cohort to 60 patients/392 ROIs.
  require_qc_pass: false
  # The legacy loader's effective ROI minimum was 10 cells. This retains the
  # corrected cohort. The manuscript's stated 1,000-cell cutoff was never
  # applied; it is recorded below as an audit only.
  min_cells_per_roi: 10
  # Same 26 protein markers as the cell annotation: the QC-failed stains
  # (CD27, CD38, Tbet, p53, EGFR, VEGF, PD-1, PD-L1, PD-L2) and the technical
  # channels (DNA1, DNA2, Carboplatin) are left out of the model inputs.
  markers: [Alpha-SMA, B7-H4, Beta-Catenin, CD107a, CD11b, CD14, CD16, CD163,
            CD20, CD3, CD31, CD366, CD4, CD44, CD45, CD45RO, CD68, CD8a,
            Collage-Type_I, E-Cadherin, FOXP3, Granzyme-B, HLA-DR-DQ-DP, Ki-67,
            Pan-keratin, Vimentin]
  audit_cell_thresholds: [1000]
  chunk_size: 150000
  max_cells_per_roi: 512
  # Corrected metadata (601 ROIs, 38 R / 25 NR) minus patient 57 and the five
  # excluded ROIs. The ROI count is recorded in cohort_report.json.
  expected_cohort:
    patients: 62
    responders: 37
    non_responders: 25

normalization:
  # Source marker values are already bounded near [0, 1]; no per-ROI log/min-max.
  transform_name: identity
  lower_quantile: 0.01
  upper_quantile: 0.99
  max_cells_per_patient: 20000
  clip_value: 5.0
  include_missing_indicators: false
  asinh_cofactor: 5.0

graph:
  # Radius is contact_scale times the ROI's 90th-percentile major cell axis.
  contact_scale: 1.25
  max_neighbors: 16
  num_rbf: 8
  min_cells_per_type: 8

model:
  hidden_dim: 64
  cell_type_dim: 24
  num_gnn_layers: 2
  dropout: 0.30

training:
  device: auto
  patient_batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.001
  max_epochs: 120
  min_epochs: 20
  patience: 15
  ranking_loss_weight: 0.10

baseline:
  c_grid: [0.01, 0.1, 1.0, 10.0]
  # Shallow, regularized trees are intentional for n=63 patients.
  random_forest:
    n_estimators: 500
    max_depth: [2, 4, null]
    min_samples_leaf: [2, 4]
    max_features: [sqrt, 0.5]
    n_jobs: 8
  xgboost:
    n_estimators: [100, 300]
    max_depth: [1, 2]
    min_child_weight: [2, 5]
    learning_rate: [0.03, 0.10]
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 1.0
    reg_lambda: 10.0
    n_jobs: 8

evaluation:
  seed: 42
  outer_folds: 5
  # 5 x 5 so that every patient is scored out-of-fold five times.
  repeats: 5
  validation_fraction: 0.20
  feature_modes: [expressions, celltypes, combined]
  models: [prevalence, roi_count, stain_batch, summary_logistic, summary_random_forest, summary_xgboost, spatial_logistic, deepsets, gnn, gnn_edge_shuffle,
           count_summary_logistic, count_summary_random_forest, count_summary_xgboost, count_spatial_logistic]
  # count_* models: the same tissue features plus log(1 + ROI count), compared
  # with roi_count alone, to ask whether tissue adds anything to the ROI-count
  # confound. Listed last so that adding them changes nothing for earlier models.
  # Edge shuffling is a spatial-specificity control; one combined run is enough.
  edge_shuffle_modes: [combined]

output:
  directory: ./artifacts/rerun/patient_benchmark
