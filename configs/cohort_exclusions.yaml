# Cohort exclusions shared by the ROI-level GNN (configs/config_rerun.yaml) and
# the patient benchmark (configs/patient_benchmark.yaml), so that the GNN uses
# the same 62-patient revision cohort as the spatial analyses (cross-PCF,
# CLAHE evaluation).
#
# LEAP IDs drop every ROI of that sample; FOVs drop single ROIs.
leap_ids:
  # Patient 57 (also LEAP108, which is not in the dataset): excluded after
  # pathology review, as not a TNBC case. 16 ROIs across all timepoints.
  - LEAP149
  - LEAP150
fovs:
  # Five ROIs removed from the revision analyses.
  # Exact names from the cell table's `fov` column; the loaders raise if any is missing.
  # Duplicates: the same ROIs acquired again in a different IMC run, kept as Leap005_1 and Leap005_2.
  - Leap005_2_1
  - Leap005_2_2
  # Broken ROIs that were retaken at the same location, kept as Leap010_8 and Leap094_10.
  - Leap010_7
  - Leap094_7
  # Not tissue: a palette region.
  - Leap095_13
